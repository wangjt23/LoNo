name: Desktop CI and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        run: node -e "if(process.env.GITHUB_REF_NAME !== 'v'+require('./package.json').version) throw Error('Tag and package version differ')"

  build:
    needs: test
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            platform: win
            arch: x64
          - runner: macos-15
            platform: mac
            arch: arm64
          - runner: macos-15-intel
            platform: mac
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Test native platform
        run: npm test
      - name: Build Windows directory
        if: matrix.platform == 'win'
        run: npx electron-builder --dir --config.directories.output=.runtime/college-build --publish never
      - name: Package and test Windows EXE
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          node scripts/package-folder.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $env:SHIGUANG_EXECUTABLE = (Resolve-Path "release/LoNo-$version/LoNo.exe").Path
          npm run test:desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx electron-builder --config electron-builder.installer.cjs --win nsis --x64 --prepackaged "release/LoNo-$version" --publish never
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -LiteralPath "release/LoNo-$version" -DestinationPath "release/LoNo-$version-win-x64.zip" -CompressionLevel Optimal
      - name: Build Mac DMG
        if: matrix.platform == 'mac'
        run: npm run dist:mac:${{ matrix.arch }}
      - name: Verify and mount Mac DMG
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          set -euo pipefail
          images=(release/*-mac-${{ matrix.arch }}.dmg)
          test "${#images[@]}" -eq 1
          hdiutil verify "${images[0]}"
          mount_dir="$RUNNER_TEMP/lono-dmg"
          install_dir="$RUNNER_TEMP/lono-install"
          mkdir -p "$mount_dir" "$install_dir"
          hdiutil attach "${images[0]}" -readonly -nobrowse -mountpoint "$mount_dir"
          trap 'hdiutil detach "$mount_dir"' EXIT
          ditto "$mount_dir/LoNo.app" "$install_dir/LoNo.app"
          codesign --verify --deep --strict --verbose=2 "$install_dir/LoNo.app"
      - name: Test Mac installed copy
        if: matrix.platform == 'mac'
        run: npm run test:desktop
        env:
          SHIGUANG_EXECUTABLE: ${{ runner.temp }}/lono-install/LoNo.app/Contents/MacOS/LoNo
      - name: Save packages
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.zip
            release/*Setup*.exe
          if-no-files-found: error
      - name: Save test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ matrix.platform }}-${{ matrix.arch }}
          path: artifacts/
          if-no-files-found: ignore

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          merge-multiple: true
          path: dist
      - name: Check complete release and checksums
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          for file in "LoNo-$version-win-x64.zip" "LoNo-Setup-$version-win-x64.exe" "LoNo-$version-mac-arm64.dmg" "LoNo-$version-mac-x64.dmg"; do
            test -s "dist/$file"
          done
          (cd dist && sha256sum *.exe *.zip *.dmg > SHA256SUMS.txt)
      - name: Publish tested release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "LoNo ${GITHUB_REF_NAME#v} · Windows & macOS Preview" --notes-file RELEASE-NOTES.md --prerelease
